<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Practical 1</title>

    <!-- JavaScript using Script Tag -->
    <script>
        alert("Welcome to JavaScript!");
    </script>
</head>

<body>

    <h1>Basic HTML Page</h1>
    <p>This is a basic HTML page with JavaScript.</p>

    <!-- JavaScript Embedded in HTML -->
    <button onclick="alert('Hello from JavaScript!')">
        Click Me
    </button>

    <!-- No Script Tag -->
    <noscript>
        <p>JavaScript is disabled in your browser.</p>
    </noscript>

</body>
</html>
